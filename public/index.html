<script>

const socket =
    new WebSocket(
        location.origin.replace("http", "ws")
    );

let myId = null;
let myTeam = null;

let scene;
let camera;
let renderer;
let player;

const remotePlayers = new Map();

let keys = {};
let weapon = "rifle";
let crouching = false;

let velocityY = 0;
let onGround = true;

/* =========================
   WEAPONS
========================= */

const weapons = {

    pistol: {
        name: "Pistol",
        magazine: 12,
        maxReserve: 36,
        damage: 25,
        price: 300
    },

    smg: {
        name: "SMG",
        magazine: 30,
        maxReserve: 90,
        damage: 18,
        price: 700
    },

    shotgun: {
        name: "Shotgun",
        magazine: 6,
        maxReserve: 18,
        damage: 70,
        price: 800
    },

    rifle: {
        name: "Rifle",
        magazine: 30,
        maxReserve: 90,
        damage: 35,
        price: 1200
    },

    sniper: {
        name: "Sniper",
        magazine: 5,
        maxReserve: 15,
        damage: 100,
        price: 1800
    },

    rpg: {
        name: "RPG",
        magazine: 1,
        maxReserve: 3,
        damage: 100,
        price: 2500
    }

};

/* =========================
   PLAYER AMMO
========================= */

let ammo = {

    pistol: {
        mag: 12,
        reserve: 24
    },

    smg: {
        mag: 30,
        reserve: 30
    },

    shotgun: {
        mag: 6,
        reserve: 6
    },

    rifle: {
        mag: 30,
        reserve: 30
    },

    sniper: {
        mag: 5,
        reserve: 5
    },

    rpg: {
        mag: 1,
        reserve: 1
    }

};

/* =========================
   SOUND SYSTEM
========================= */

const audioContext =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

function sound(
    frequency,
    duration,
    type = "square",
    volume = 0.08
) {

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.value =
        volume;

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime +
        duration
    );

    oscillator.stop(
        audioContext.currentTime +
        duration
    );
}

function shootSound() {

    sound(
        90,
        0.12,
        "sawtooth",
        0.15
    );

    setTimeout(() => {

        sound(
            45,
            0.08,
            "square",
            0.08
        );

    }, 30);
}

function reloadSound() {

    sound(
        220,
        0.08,
        "triangle",
        0.08
    );

    setTimeout(() => {

        sound(
            330,
            0.08,
            "triangle",
            0.08
        );

    }, 120);
}

function emptySound() {

    sound(
        180,
        0.08,
        "square",
        0.12
    );
}

function explosionSound() {

    sound(
        45,
        0.6,
        "sawtooth",
        0.25
    );
}

/* =========================
   WEBSOCKET
========================= */

socket.onmessage = event => {

    const data =
        JSON.parse(event.data);

    if (data.type === "welcome") {

        myId = data.id;

        myTeam = data.team;

        document.getElementById(
            "team"
        ).textContent =
            "Team: " + myTeam;
    }

    if (data.type === "state") {

        updateGame(data);
    }

    if (data.type === "gameOver") {

        alert(
            "Game Over: " +
            data.winner
        );
    }
};

function send(data) {

    if (
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(data)
        );
    }
}

/* =========================
   INIT
========================= */

function init() {

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x687070
        );

    camera =
        new THREE.PerspectiveCamera(
            75,
            innerWidth / innerHeight,
            0.1,
            1000
        );

    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    document.body.appendChild(
        renderer.domElement
    );

    const light =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );

    scene.add(light);

    createMap();

    const geo =
        new THREE.BoxGeometry(
            1,
            2,
            1
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color: 0x2277ff
        });

    player =
        new THREE.Mesh(
            geo,
            mat
        );

    player.position.set(
        0,
        1,
        8
    );

    scene.add(player);

    setupControls();

    animate();
}

/* =========================
   MAP
========================= */

function createMap() {

    const ground =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                80,
                1,
                80
            ),
            new THREE.MeshStandardMaterial({
                color: 0x333936
            })
        );

    ground.position.y = -0.5;

    scene.add(ground);

    for (
        let i = -15;
        i <= 15;
        i += 10
    ) {

        const cover =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    5,
                    2,
                    2
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x555555
                })
            );

        cover.position.set(
            i,
            1,
            0
        );

        scene.add(cover);
    }

    const wall =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                40,
                4,
                1
            ),
            new THREE.MeshStandardMaterial({
                color: 0x444444
            })
        );

    wall.position.set(
        0,
        2,
        -20
    );

    scene.add(wall);
}

/* =========================
   CONTROLS
========================= */

function setupControls() {

    document.addEventListener(
        "keydown",
        e => {

            keys[
                e.key.toLowerCase()
            ] = true;

            if (e.key === " ")
                jump();

            if (
                e.key.toLowerCase() === "c"
            )
                crouching = true;

            if (
                e.key.toLowerCase() === "r"
            )
                buyAmmo();

            if (
                e.key >= "1" &&
                e.key <= "6"
            ) {

                const list = [
                    "pistol",
                    "smg",
                    "shotgun",
                    "rifle",
                    "sniper",
                    "rpg"
                ];

                weapon =
                    list[
                        Number(e.key) - 1
                    ];

                updateAmmoHUD();

                send({
                    type: "weapon",
                    weapon
                });
            }
        }
    );

    document.addEventListener(
        "keyup",
        e => {

            keys[
                e.key.toLowerCase()
            ] = false;

            if (
                e.key.toLowerCase() === "c"
            )
                crouching = false;
        }
    );

    document.addEventListener(
        "mousedown",
        e => {

            if (
                audioContext.state ===
                "suspended"
            )
                audioContext.resume();

            if (e.button === 0)
                fire();

            if (e.button === 2)
                scope(true);
        }
    );

    document.addEventListener(
        "mouseup",
        e => {

            if (e.button === 2)
                scope(false);
        }
    );

    document.addEventListener(
        "contextmenu",
        e => e.preventDefault()
    );
}

/* =========================
   SHOOTING
========================= */

function fire() {

    const current =
        ammo[weapon];

    if (current.mag <= 0) {

        emptySound();

        document.getElementById(
            "ammo"
        ).textContent =
            "تیر تمام شد! R = خرید تیر";

        return;
    }

    current.mag--;

    shootSound();

    updateAmmoHUD();

    let closest = null;

    let distance = Infinity;

    for (
        const [id, mesh]
        of remotePlayers
    ) {

        const d =
            camera.position.distanceTo(
                mesh.position
            );

        if (d < distance) {

            distance = d;

            closest = id;
        }
    }

    if (closest) {

        send({
            type: "shoot",
            targetId: closest,
            weapon
        });
    }

    /* RPG */

    if (weapon === "rpg") {

        explosionSound();
    }
}

/* =========================
   BUY AMMO
========================= */

function buyAmmo() {

    /*
       هر بار R:

       100 i

       مقدار مشخصی تیر اضافه می‌شود.
    */

    send({
        type: "buyAmmo",
        weapon
    });

    reloadSound();
}

/* =========================
   RELOAD
========================= */

function reload() {

    const current =
        ammo[weapon];

    const info =
        weapons[weapon];

    const needed =
        info.magazine -
        current.mag;

    if (needed <= 0)
        return;

    if (current.reserve <= 0) {

        emptySound();

        return;
    }

    const amount =
        Math.min(
            needed,
            current.reserve
        );

    current.mag += amount;

    current.reserve -= amount;

    reloadSound();

    updateAmmoHUD();
}

/* =========================
   JUMP
========================= */

function jump() {

    if (!onGround)
        return;

    velocityY = 0.22;

    onGround = false;
}

/* =========================
   MOVEMENT
========================= */

function movement() {

    const speed =
        crouching
            ? 0.055
            : 0.11;

    if (keys["w"])
        player.position.z -= speed;

    if (keys["s"])
        player.position.z += speed;

    if (keys["a"])
        player.position.x -= speed;

    if (keys["d"])
        player.position.x += speed;

    velocityY -= 0.012;

    player.position.y +=
        velocityY;

    if (player.position.y <= 1) {

        player.position.y = 1;

        velocityY = 0;

        onGround = true;
    }

    send({
        type: "move",

        x: player.position.x,

        y: player.position.y,

        z: player.position.z,

        crouching
    });

    camera.position.copy(
        player.position
    );

    camera.position.y +=
        crouching ? .25 : .6;

    camera.position.z += 5;
}

/* =========================
   SNIPER SCOPE
========================= */

function scope(enabled) {

    if (weapon !== "sniper")
        return;

    const element =
        document.getElementById(
            "scope"
        );

    element.style.display =
        enabled
            ? "block"
            : "none";

    camera.fov =
        enabled
            ? 20
            : 75;

    camera.updateProjectionMatrix();
}

/* =========================
   HUD
========================= */

function updateAmmoHUD() {

    const current =
        ammo[weapon];

    document.getElementById(
        "ammo"
    ).textContent =
        weapons[weapon].name +
        " | " +
        current.mag +
        " / " +
        current.reserve;
}

/* =========================
   SERVER STATE
========================= */

function updateGame(data) {

    document.getElementById(
        "round"
    ).textContent =
        "Round: " +
        data.round +
        " / 10";

    document.getElementById(
        "score"
    ).textContent =
        data.score.red +
        " - " +
        data.score.blue;

    const seconds =
        Math.ceil(
            data.timeLeft / 1000
        );

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        seconds % 60;

    document.getElementById(
        "timer"
    ).textContent =
        String(minutes).padStart(
            2,
            "0"
        ) +
        ":" +
        String(secs).padStart(
            2,
            "0"
        );

    const me =
        data.players.find(
            p => p.id === myId
        );

    if (me) {

        document.getElementById(
            "money"
        ).textContent =
            "i: " + me.money;
    }

    const existing =
        new Set();

    for (
        const p of data.players
    ) {

        if (p.id === myId)
            continue;

        existing.add(p.id);

        let mesh =
            remotePlayers.get(
                p.id
            );

        if (!mesh) {

            mesh =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        1,
                        2,
                        1
                    ),
                    new THREE.MeshStandardMaterial({
                        color:
                            p.team === "red"
                                ? 0xff3333
                                : 0x3333ff
                    })
                );

            scene.add(mesh);

            remotePlayers.set(
                p.id,
                mesh
            );
        }

        mesh.position.set(
            p.x,
            p.y,
            p.z
        );

        mesh.visible =
            p.alive;
    }

    for (
        const [id, mesh]
        of remotePlayers
    ) {

        if (!existing.has(id)) {

            scene.remove(mesh);

            remotePlayers.delete(id);
        }
    }
}

/* =========================
   GAME LOOP
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );

    movement();

    renderer.render(
        scene,
        camera
    );
}

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

init();

</script>
